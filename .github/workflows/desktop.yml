name: Desktop

# The desktop shell's checks, and the packaged app for each platform, built with the same command
# a contributor runs (scripts/build.sh). The artifacts are unsigned: see
# docs/internals/0010-desktop-shell.md.

on:
  push:
    branches: [main, v1]
  pull_request:
    paths:
      - apps/**
      - crates/**
      - assets/**
      - scripts/build.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/desktop.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Shell typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop typecheck
      - run: pnpm --dir apps/desktop test

  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build the web UI, the binary and the app
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/release/pulse
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.dmg
