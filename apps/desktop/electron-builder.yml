# Packaging for the desktop app. Run through `node scripts/package.mjs` (or the repository's
# scripts/build.sh), which builds first and sets the version from the bundled `pulse` binary.
# The product's name is what people read: the macOS app bundle, the Linux launcher entry, the
# window and the menus. The app id is reverse DNS under the owner's lictory.com and keys macOS
# preferences and notification permission, so it must not change once a package is released.
# Identifiers stay `pulse`: the executable, the .desktop file (package.json desktopName) and the
# bundled CLI. Artifact file names have no spaces, so they can be used in a shell unquoted.
appId: com.lictory.pulse
productName: Lictory Pulse
copyright: Copyright © 2026 Christian Carpinelli
directories:
  output: release
  buildResources: build
# The app is two bundles; it has no runtime node_modules.
files:
  - dist/main.cjs
  - dist/preload.cjs
  - package.json
extraMetadata:
  main: dist/main.cjs
extraResources:
  # The same `pulse` binary as the headless install: the app starts the daemon with it, and
  # "Install command line tool" links to it.
  - from: ../../target/release/pulse
    to: bin/pulse
  - from: build/icons
    to: icons
    filter: ["*.png"]
asar: true
npmRebuild: false
# Before the AppImage or dmg is assembled: no group- or world-writable files in the app.
afterPack: scripts/after-pack.cjs
nodeGypRebuild: false
publish: null
# Electron features the app does not use, switched off in the binary itself.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
# The upstream static AppImage runtime (beta in electron-builder 26). The default one links
# libfuse.so.2, which Ubuntu 22.04 and later do not install, and on arm64 the unversioned
# libz.so, which only zlib's development package provides: the AppImage would not start.
toolsets:
  appimage: "1.0.3"
linux:
  target: AppImage
  category: Development
  icon: build/icons/icon.png
  # Not `pulse`: that name belongs to the CLI.
  executableName: pulse-desktop
  # WM_CLASS matches the .desktop file, so docks group the window with its launcher.
  syncDesktopName: true
  synopsis: The local event layer for AI agents
  artifactName: Lictory-Pulse-${version}-linux-${arch}.${ext}
mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: build/icons/icon.png
  # Ad-hoc signature only: Apple Silicon refuses to run unsigned code, and there is no Developer
  # ID yet. Gatekeeper still blocks the app on first open (docs/internals/0010-desktop-shell.md).
  identity: "-"
  hardenedRuntime: false
  artifactName: Lictory-Pulse-${version}-mac-${arch}.${ext}
dmg:
  artifactName: Lictory-Pulse-${version}-mac-${arch}.${ext}
