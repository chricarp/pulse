[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/pulse-dev/pulse"
rust-version = "1.85"

[workspace.dependencies]
pulse-contracts = { path = "crates/pulse-contracts" }
pulse-core = { path = "crates/pulse-core" }
pulse-store = { path = "crates/pulse-store" }
pulse-sources = { path = "crates/pulse-sources" }
pulse-agents = { path = "crates/pulse-agents" }
pulse-mcp = { path = "crates/pulse-mcp" }
pulse-daemon = { path = "crates/pulse-daemon" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.1"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
ulid = "3.0.0"
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint"] }
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"

# The daemon runs all day on the user's machine: a small binary matters more than build time.
# `panic` stays `unwind`: a panic in one task (one connection, one run) must not take the
# daemon down with it, and tokio only contains panics when they unwind.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
