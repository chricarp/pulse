[package]
name = "pulse-sources"
description = "Lictory Pulse: the Source trait and the built-in event sources."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
pulse-contracts.workspace = true
pulse-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "net", "macros", "rt", "process", "signal", "io-util", "io-std"] }
tokio-util.workspace = true

chrono = { version = "0.4.39", default-features = false, features = ["clock", "std"] }
chrono-tz.workspace = true
miniz_oxide = "0.9"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
pty-process = { version = "0.5", features = ["async"] }
rustix = { version = "1", features = ["fs", "process", "pty", "termios", "time", "stdio"] }
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
# Only to check `calendar::recur` against: the expander itself is ours, so its cost is bounded.
rrule = "0.14"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
