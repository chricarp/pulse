[package]
name = "pulse-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "pulse"
path = "src/main.rs"

[features]
# The shipped binary compiles SEP-3415 in, off at runtime by default (one config line turns it
# on). `--no-default-features` builds without it.
default = ["sep3415"]
sep3415 = ["pulse-daemon/sep3415"]

[dependencies]
pulse-contracts.workspace = true
pulse-daemon.workspace = true
pulse-sources.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "process"] }

clap = { version = "4.5.40", features = ["derive"] }

[dev-dependencies]
pulse-core.workspace = true
tempfile.workspace = true

[lints]
workspace = true
